<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>For My Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Caveat:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy-deep:#16070d;
    --burgundy:#2b0b18;
    --burgundy-light:#59152b;
    --gingham-red:#7e263d;
    --gingham-cream:#f3e6d8;
    --cream:#f8efe2;
    --blush:#f3d9c9;
    --blush-deep:#e8b8a2;
    --rose:#c97a72;
    --gold:#cf9e56;
    --gold-soft:#e3c384;
    --leopard:#3b2416;
    --ink:#2a1810;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--burgundy-deep);
    color:var(--cream);
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }
  h1,h2,.script{font-family:'Caveat',cursive;}
  .serif{font-family:'Playfair Display',serif;}

  #scroll-container{
    height:100vh;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
  }
  section{
    position:relative;
    height:100vh;
    width:100%;
    scroll-snap-align:start;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  /* ---------- NAV DOTS ---------- */
  #navdots{
    position:fixed;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    z-index:1200;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  #navdots button{
    width:10px;height:10px;border-radius:50%;
    background:rgba(248,239,226,0.35);
    border:1px solid rgba(248,239,226,0.5);
    cursor:pointer;
    padding:0;
    transition:background .3s, transform .3s;
  }
  #navdots button.active{
    background:var(--gold-soft);
    transform:scale(1.35);
  }

  /* ================= SECTION 1 : GAME ================= */
  #game{
    background:
      radial-gradient(circle at 50% 35%, rgba(217,122,108,.20), transparent 34%),
      radial-gradient(circle at 10% 90%, rgba(227,195,132,.13), transparent 28%),
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(255,255,255,0.07) 38px 42px),
      repeating-linear-gradient(90deg, transparent 0 38px, rgba(255,255,255,0.07) 38px 42px),
      var(--gingham-red);
  }
  #game::before{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.35) 100%);
    pointer-events:none;
  }
  .game-title{
    position:relative;z-index:5;
    text-align:center;
    color:var(--gingham-cream);
    text-shadow:0 2px 10px rgba(0,0,0,0.35);
    margin:0;
    padding-top:2.2rem;
  }
  .game-title .line1{font-size:4.2rem;font-weight:700;display:block;}
  .game-subtitle{
    position:relative;z-index:5;
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:0.95rem;
    color:var(--gingham-cream);
    opacity:0.9;
    margin-top:-0.4rem;
  }
  #score-pill{
    position:absolute;top:1.2rem;right:1.2rem;z-index:6;
    background:rgba(42,13,22,0.55);
    border:1px solid rgba(243,230,216,0.4);
    border-radius:999px;
    padding:0.4rem 1rem;
    font-size:0.85rem;
    letter-spacing:0.02em;
    backdrop-filter:blur(3px);
  }
  #game-field{
    position:relative;
    width:100%;
    flex:1;
    z-index:2;
  }
  .falling-item{
    position:absolute;
    font-size:4.2rem;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,0.35));
    will-change:transform;
    user-select:none;
    pointer-events:none;
  }
  .catch-pop{
    position:absolute;
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-style:italic;
    color:var(--gold-soft);
    font-size:1.3rem;
    pointer-events:none;
    animation:popUp 0.7s ease-out forwards;
  }
  @keyframes popUp{
    0%{opacity:1;transform:translateY(0) scale(0.8);}
    100%{opacity:0;transform:translateY(-45px) scale(1.15);}
  }
  #basket{
    position:absolute;
    bottom:6%;
    width:245px;
    height:155px;
    left:50%;
    transform:translateX(-50%);
    touch-action:none;
    cursor:grab;
    z-index:4;
  }
  #basket .handle{
    position:absolute;
    top:-28px;left:50%;
    transform:translateX(-50%);
    width:138px;height:82px;
    border:11px solid #7a4a26;
    border-bottom:none;
    border-radius:60px 60px 0 0;
  }
  #basket .body{
    position:absolute;
    bottom:0;left:0;right:0;
    height:125px;
    border-radius:14px 14px 30px 30px / 14px 14px 46px 46px;
    background:
      repeating-linear-gradient(115deg, #b1793f 0 8px, #8c5b2b 8px 16px),
      repeating-linear-gradient(65deg, rgba(0,0,0,0.12) 0 8px, transparent 8px 16px);
    box-shadow:0 10px 18px rgba(0,0,0,0.4), inset 0 -6px 10px rgba(0,0,0,0.25);
    border:2px solid #5f3a1a;
  }
  #basket .cloth{
    position:absolute;
    top:-6px;left:14px;right:14px;
    height:30px;
    background:repeating-linear-gradient(90deg, var(--gingham-red) 0 10px, var(--gingham-cream) 10px 20px);
    border-radius:4px 4px 0 0;
    transform:rotate(-2deg);
  }
  #continue-1{
    position:relative;z-index:6;
    margin-top:1.4rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .6s ease;
  }
  #continue-1.show{opacity:1;pointer-events:auto;}

  .btn{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:1rem;
    letter-spacing:0.02em;
    background:var(--burgundy-deep);
    color:var(--gold-soft);
    border:1px solid var(--gold-soft);
    border-radius:999px;
    padding:0.65rem 1.8rem;
    cursor:pointer;
    transition:transform .25s ease, background .25s ease, color .25s ease;
  }
  .btn:hover{background:var(--gold-soft);color:var(--burgundy-deep);transform:translateY(-2px);}
  .btn:active{transform:translateY(0);}
  .btn.light{
    background:var(--cream);color:var(--burgundy-deep);border-color:var(--cream);
  }
  .btn.light:hover{background:var(--gold-soft);border-color:var(--gold-soft);}

  /* ================= SECTION 2 : MIXTAPE ================= */
  #mixtape{
    background:
      radial-gradient(circle at 8% 12%, rgba(233,178,150,0.55), transparent 32%),
      radial-gradient(circle at 92% 15%, rgba(198,150,190,0.4), transparent 30%),
      radial-gradient(circle at 10% 90%, rgba(233,178,150,0.5), transparent 30%),
      radial-gradient(circle at 95% 88%, rgba(214,197,130,0.4), transparent 30%),
      linear-gradient(160deg, var(--blush) 0%, var(--blush-deep) 55%, #e6ac9c 100%);
  }
  .corner-bloom{
    position:absolute;
    width:230px;height:230px;
    z-index:1;
    pointer-events:none;
    opacity:0.9;
  }
  .corner-bloom.tl{top:-60px;left:-60px;}
  .corner-bloom.tr{top:-60px;right:-60px;transform:scaleX(-1);}
  .corner-bloom.bl{bottom:-60px;left:-60px;transform:scaleY(-1);}
  .corner-bloom.br{bottom:-60px;right:-60px;transform:scale(-1,-1);}

  .mixtape-card{
    position:relative;z-index:3;
    width:min(420px,88vw);
    background:linear-gradient(165deg,#fbf1e6,#f3e0cf);
    border-radius:18px;
    padding:1.6rem 1.6rem 1.3rem;
    box-shadow:0 24px 50px rgba(60,20,20,0.35);
  }
  .mixtape-eyebrow{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:0.78rem;
    letter-spacing:0.08em;
    color:#a06a4c;
    margin:0;
  }
  .mixtape-title{
    font-size:2.2rem;
    color:var(--ink);
    margin:0.1rem 0 0.9rem;
  }
  .cassette{
    position:relative;
    background:repeating-linear-gradient(45deg, #e88fa0 0 14px, #f2aab6 14px 28px);
    border:5px solid #c96c85;
    border-radius:14px;
    padding:1rem 1rem 0.6rem;
    box-shadow:inset 0 0 0 6px rgba(255,255,255,0.25), 0 10px 20px rgba(0,0,0,0.18);
  }
  .cassette .label{
    background:#fdf1e9;
    border-radius:6px;
    text-align:center;
    padding:0.25rem;
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:0.82rem;
    color:#8a4a5a;
    margin-bottom:0.7rem;
  }
  .reels{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#3a1f28;
    border-radius:10px;
    padding:0.9rem 1.1rem;
    position:relative;
  }
  .reel{
    width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at center, #6b3446 0 30%, #a45b74 32% 60%, #6b3446 62% 100%);
    border:3px solid #cf9e56;
    animation:spin 4s linear infinite;
  }
  .reels.paused .reel{animation-play-state:paused;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .reel-tape{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:64%;height:10px;
    background:#f5ece0;
    border-radius:4px;
  }
  .cassette .screws{position:absolute;width:9px;height:9px;background:#8a5a2c;border-radius:50%;box-shadow:inset 0 0 0 2px #5f3a1a;}
  .cassette .s1{top:8px;left:8px;} .cassette .s2{top:8px;right:8px;}
  .cassette .s3{bottom:8px;left:8px;} .cassette .s4{bottom:8px;right:8px;}

  .song-list{margin-top:1.1rem;}
  .song-row{
    display:flex;align-items:center;gap:0.7rem;
    padding:0.55rem 0.15rem;
    border-bottom:1px solid rgba(138,74,90,0.18);
  }
  .song-row:last-child{border-bottom:none;}
  .song-num{font-family:'Playfair Display',serif;font-style:italic;color:#a06a4c;width:1.2rem;}
  .song-meta{flex:1;min-width:0;}
  .song-title{
    font-weight:500;color:var(--ink);font-size:0.95rem;
    background:transparent;border:none;outline:none;width:100%;
    font-family:'Poppins',sans-serif;
  }
  .song-artist{
    font-size:0.75rem;color:#9a6a55;
    background:transparent;border:none;outline:none;width:100%;
    font-family:'Poppins',sans-serif;
  }
  .play-btn{
    width:34px;height:34px;border-radius:50%;
    border:1.5px solid #a06a4c;
    background:#fdf1e9;color:#8a4a3a;
    cursor:pointer;font-size:0.85rem;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }

  .liner-note{
    margin-top:1rem;
    background:#f6dfa9;
    border-radius:8px;
    padding:0.7rem 0.9rem;
    box-shadow:0 4px 8px rgba(0,0,0,0.12);
    transform:rotate(-1deg);
  }
  .liner-note .tag{
    font-size:0.65rem;letter-spacing:0.08em;color:#8a6a2c;
    font-family:'Poppins',sans-serif;
  }
  .liner-note textarea{
    width:100%;border:none;background:transparent;resize:none;
    font-family:'Playfair Display',serif;font-style:italic;font-size:0.95rem;
    color:#4a2f10;outline:none;margin-top:0.15rem;
  }
  .mixtape-actions{
    display:flex;justify-content:center;margin-top:1.1rem;
  }

  /* ================= SECTION 3 : SCRAPBOOK ================= */
  #scrapbook{
    background:
      radial-gradient(circle at 50% 0%, rgba(99,26,44,0.6), transparent 55%),
      var(--burgundy);
  }
  .leopard-corner{
    position:absolute;width:260px;height:340px;z-index:0;opacity:0.9;
    background-image:
      radial-gradient(ellipse 18px 12px at 20% 20%, var(--leopard) 40%, transparent 42%),
      radial-gradient(ellipse 14px 10px at 55% 15%, var(--leopard) 40%, transparent 42%),
      radial-gradient(ellipse 16px 11px at 80% 30%, var(--leopard) 40%, transparent 42%),
      radial-gradient(ellipse 15px 10px at 30% 45%, var(--leopard) 40%, transparent 42%),
      radial-gradient(ellipse 17px 12px at 65% 55%, var(--leopard) 40%, transparent 42%),
      radial-gradient(ellipse 13px 9px at 15% 70%, var(--leopard) 40%, transparent 42%),
      radial-gradient(ellipse 16px 11px at 45% 80%, var(--leopard) 40%, transparent 42%),
      radial-gradient(ellipse 14px 10px at 80% 85%, var(--leopard) 40%, transparent 42%),
      linear-gradient(180deg, var(--gold-soft), var(--gold));
    clip-path:polygon(0 0, 100% 0, 100% 30%, 60% 55%, 100% 60%, 70% 100%, 0 100%);
  }
  .leopard-corner.top{top:0;right:0;}
  .leopard-corner.bottom{bottom:0;left:0;transform:rotate(180deg);}

  .scrap-wrap{
    position:relative;z-index:3;
    width:min(760px,92vw);
    display:flex;
    flex-wrap:wrap;
    gap:1.35rem;
    justify-content:center;
    align-items:flex-end;
    padding:1rem 0;
  }
  .polaroid{
    background:#fbf6ee;
    padding:10px 10px 34px;
    box-shadow:0 14px 26px rgba(0,0,0,0.45);
    width:185px;
    cursor:pointer;
    position:relative;
    transition:transform .3s ease;
  }
  .polaroid:hover{transform:translateY(-4px) rotate(0deg) !important;}
  .polaroid:nth-child(1){transform:rotate(-6deg);}
  .polaroid:nth-child(2){transform:rotate(3deg);}
  .polaroid:nth-child(3){transform:rotate(-2deg);}
  .polaroid .frame{
    width:100%;aspect-ratio:1/1.05;
    background:linear-gradient(160deg,#3a2530,#241017);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    border-radius:1px;
  }
  .polaroid .frame img{width:100%;height:100%;object-fit:cover;display:block;}
  .polaroid .frame .plus{
    color:rgba(248,239,226,0.55);
    font-size:1.8rem;font-family:'Playfair Display',serif;
  }
  .polaroid input[type=file]{display:none;}

  .seal{
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #b23a4a, #7a1f2c 70%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-style:italic;color:var(--gold-soft);
    box-shadow:0 6px 14px rgba(0,0,0,0.4);
    margin:1.1rem auto 0.2rem;
    z-index:3;position:relative;
  }
  .scrap-heading{
    position:relative;z-index:3;text-align:center;
    margin:0.6rem 0 0;
  }
  .scrap-heading .from{
    font-family:'Playfair Display',serif;font-style:italic;
    font-size:0.85rem;color:var(--gold-soft);letter-spacing:0.04em;
  }
  .scrap-note{
    position:relative;z-index:3;
    width:min(480px,88vw);
    text-align:center;
    margin-top:0.7rem;
  }
  .scrap-note textarea{
    width:100%;background:transparent;border:none;outline:none;resize:none;
    color:var(--cream);
    font-family:'Playfair Display',serif;font-style:italic;font-size:1.05rem;
    line-height:1.6;text-align:center;
  }
  .scrap-actions{position:relative;z-index:3;margin-top:0.8rem;}


  .art-strip{
    position:relative; z-index:3;
    display:flex; gap:.7rem; justify-content:center; align-items:center;
    width:min(620px,90vw); margin:.65rem auto 0;
  }
  .art-card{
    width:118px; height:74px; padding:.45rem;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(145deg,#f2d7c5,#c9908a);
    color:#4a1724; border:1px solid rgba(227,195,132,.6);
    box-shadow:0 10px 20px rgba(0,0,0,.28);
    transform:rotate(-3deg);
    font-family:'Playfair Display',serif;
    font-size:1.45rem;
  }
  .art-card:nth-child(2){transform:rotate(3deg);background:linear-gradient(145deg,#e5c5bd,#8e5060);}
  .art-card:nth-child(3){transform:rotate(-1deg);background:linear-gradient(145deg,#ead7ad,#a86b69);}
  .art-card span{font-size:.58rem;letter-spacing:.04em;font-style:italic;margin-top:.15rem;}
  @media (max-width:480px){
    #basket{width:190px;height:130px;}
    #basket .handle{width:110px;height:70px;}
    #basket .body{height:105px;}
    .art-card{width:92px;height:64px;font-size:1.15rem;}
  }

  /* ================= SECTION 4 : FAVORITE PERSON ================= */
  #favorite{
    background:
      radial-gradient(circle at 15% 20%, rgba(178,58,74,0.5), transparent 35%),
      radial-gradient(circle at 85% 25%, rgba(120,30,40,0.5), transparent 32%),
      radial-gradient(circle at 50% 100%, rgba(178,58,74,0.4), transparent 40%),
      var(--burgundy-deep);
  }
  .fav-heading{
    position:relative;z-index:3;text-align:center;
    font-size:3rem;color:var(--gingham-cream);
    text-shadow:0 3px 14px rgba(0,0,0,0.4);
    margin:0 0 1.3rem;
    line-height:0.95;
  }
  .video-frame{
    position:relative;z-index:3;
    width:min(520px,90vw);
    aspect-ratio:16/10;
    background:linear-gradient(160deg,#3a1620,#1c0810);
    border:2px solid rgba(207,158,86,0.5);
    border-radius:16px;
    box-shadow:0 24px 50px rgba(0,0,0,0.5);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    overflow:hidden;
  }
  .video-frame video{width:100%;height:100%;object-fit:cover;display:none;}
  .video-frame .placeholder{
    text-align:center;color:rgba(243,230,216,0.75);
  }
  .video-frame .placeholder .icon{
    font-size:2.4rem;display:block;margin-bottom:0.4rem;
  }
  .video-frame input[type=file]{display:none;}
  .fav-sub{
    position:relative;z-index:3;
    font-family:'Playfair Display',serif;font-style:italic;
    font-size:0.9rem;color:rgba(243,230,216,0.75);
    margin-top:1rem;text-align:center;
  }
  .fav-restart{margin-top:1.4rem;position:relative;z-index:3;}

  .petal-deco{position:absolute;font-size:1.6rem;opacity:0.35;pointer-events:none;z-index:1;}

  /* ================= FLOWER TRANSITION OVERLAY ================= */
  #flower-overlay{
    position:fixed;inset:0;
    z-index:999;
    pointer-events:none;
    opacity:0;
  }
  #flower-overlay .petal{
    position:absolute;
    font-size:2.4rem;
    opacity:0;
    transform:scale(0.3) rotate(0deg);
  }
  #flower-overlay.playing{
    background:radial-gradient(circle, rgba(233,178,150,0.0) 0%, rgba(70,16,29,0.0) 100%);
  }

  #flower-overlay::before{
    content:"";
    position:absolute; inset:-20%;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 12%, rgba(22,7,13,.08) 25%, rgba(22,7,13,.78) 68%, rgba(22,7,13,.98) 100%);
    transform:scale(.25);
    opacity:0;
    animation:flowerCurtain 1.5s ease-in-out forwards;
  }
  #flower-overlay.playing::before{opacity:1;}
  @keyframes flowerCurtain{
    0%{transform:scale(.18) rotate(-8deg); opacity:0;}
    42%{transform:scale(.75) rotate(7deg); opacity:.35;}
    68%{transform:scale(1.45) rotate(-5deg); opacity:.72;}
    100%{transform:scale(1.9) rotate(0deg); opacity:0;}
  }

  @keyframes petalIn{
    0%{opacity:0;transform:scale(0.2) rotate(0deg) translateY(40px);}
    55%{opacity:1;transform:scale(1.5) rotate(200deg) translateY(0);}
    100%{opacity:0;transform:scale(2.1) rotate(360deg) translateY(-30px);}
  }

  /* small screens */
  @media (max-width:480px){
    .game-title .line1{font-size:2rem;}
    #basket{width:130px;height:95px;}
    .fav-heading{font-size:2.3rem;}
    .mixtape-title{font-size:1.8rem;}
  }

    /* --- illustrated food + sparkle atmosphere --- */
    #game {
      position: relative;
      overflow: hidden;

    <div class="petal-deco" style="top:8%;left:10%;">🌷</div>
    <div class="petal-deco" style="top:15%;right:8%;">🌸</div>
    <div class="petal-deco" style="bottom:12%;left:8%;">🌼</div>
    <div class="petal-deco" style="bottom:18%;right:10%;">🌹</div>

    <h2 class="fav-heading">Favorite<br>person</h2>
    <label class="video-frame" id="videoFrame">
      <div class="placeholder" id="videoPlaceholder">
        <span class="icon">▶</span>
        нажми, чтобы выбрать своё видео
      </div>
      <video id="loveVideo" playsinline controls preload="metadata"></video>
      <input type="file" accept="video/*" id="videoInput">
    </label>
    <p class="fav-sub">made with you in mind, always</p>
    <button class="btn" id="restartBtn">start over &nbsp;↺</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* ---------------- helpers ---------------- */
  function $(sel,ctx){return (ctx||document).querySelector(sel);}
  function $all(sel,ctx){return Array.prototype.slice.call((ctx||document).querySelectorAll(sel));}

  var scrollContainer = $('#scroll-container');
  var sections = $all('section', scrollContainer);
  var navButtons = $all('#navdots button');

  function goToSection(id){
    var target = document.getElementById(id);
    if(!target) return;
    playFlowerTransition(function(){
      target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  }

  navButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      goToSection(btn.dataset.target);
    });
  });

  /* highlight active nav dot on scroll */
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        navButtons.forEach(function(b){
          b.classList.toggle('active', b.dataset.target === entry.target.id);
        });
      }
    });
  }, {root: scrollContainer, threshold:0.6});
  sections.forEach(function(s){ io.observe(s); });

  /* ---------------- flower transition ---------------- */
  var flowerEmoji = ['🌸','🌷','🌹','🌼','🌺','🪷','✿','❀'];
  var overlay = $('#flower-overlay');
  function playFlowerTransition(mid){
    overlay.classList.add('playing');
    overlay.style.opacity = '1';
    overlay.innerHTML = '';
    var count = 72;
    for(var i=0;i<count;i++){
      var p = document.createElement('div');
      p.className = 'petal';
      p.textContent = flowerEmoji[i % flowerEmoji.length];
      var x = Math.random()*100;
      var y = Math.random()*100;
      var delay = Math.random()*0.42;
      var dur = 1.15 + Math.random()*0.65;
      p.style.left = x+'vw';
      p.style.top = y+'vh';
      p.style.animation = 'petalIn '+dur+'s ease-in '+delay+'s forwards';
      overlay.appendChild(p);
    }
    setTimeout(function(){
      if(mid) mid();
    }, 620);
    setTimeout(function(){
      overlay.style.opacity = '0';
      overlay.classList.remove('playing');
      overlay.innerHTML = '';
    }, 1500);
  }

  /* ---------------- SECTION 1: catching game ---------------- */
  var gameField = $('#game-field');
  var basket = $('#basket');
  var scoreEl = $('#score');
  var targetScore = 12;
  $('#target').textContent = targetScore;
  var score = 0;
  var gameActive = true;
  var basketX = 0.5; // fraction of width

  function positionBasket(clientX){
    var rect = gameField.getBoundingClientRect();
    var frac = (clientX - rect.left) / rect.width;
    frac = Math.max(0.09, Math.min(0.91, frac));
    basketX = frac;
    basket.style.left = (frac*100)+'%';
  }

  gameField.addEventListener('pointermove', function(e){
    positionBasket(e.clientX);
  });
  gameField.addEventListener('pointerdown', function(e){
    positionBasket(e.clientX);
  });
  // touch fallback for older browsers
  gameField.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]){
      positionBasket(e.touches[0].clientX);
      e.preventDefault();
    }
  }, {passive:false});

  var foodEmoji = ['🥐','🍩','🥞','🍓','🍒','🍰','🧁','🥧','🧇','🍪','🍎','🍞','🍇'];
  var fallingItems = [];

  function spawnItem(){
    if(!gameActive) return;
    var el = document.createElement('div');
    el.className = 'falling-item';
    el.textContent = foodEmoji[Math.floor(Math.random()*foodEmoji.length)];
    var fieldRect = gameField.getBoundingClientRect();
    var startX = 6 + Math.random()*(88);
    el.style.left = startX+'%';
    el.style.top = '-50px';
    gameField.appendChild(el);
    var duration = 2800 + Math.random()*1500;
    var item = {
      el: el,
      startTime: performance.now(),
      duration: duration,
      startXPercent: startX,
      caught: false
    };
    fallingItems.push(item);
  }

  var spawnTimer = setInterval(spawnItem, 480);

  function catchPop(x,y){
    var pop = document.createElement('div');
    pop.className = 'catch-pop';
    pop.textContent = '+1';
    pop.style.left = x+'px';
    pop.style.top = y+'px';
    gameField.appendChild(pop);
    setTimeout(function(){ pop.remove(); }, 720);
  }

  function tick(now){
    var fieldRect = gameField.getBoundingClientRect();
    var basketRect = basket.getBoundingClientRect();

    for(var i = fallingItems.length-1; i>=0; i--){
      var item = fallingItems[i];
      var t = (now - item.startTime) / item.duration;
      if(t >= 1 || item.caught){
        if(item.el.parentNode) item.el.remove();
        fallingItems.splice(i,1);
        continue;
      }
      var yPos = t * (fieldRect.height + 60) - 50;
      item.el.style.transform = 'translateY('+yPos+'px)';

      if(gameActive){
        var itemRect = item.el.getBoundingClientRect();
        var overlapX = itemRect.left < basketRect.right - 20 && itemRect.right > basketRect.left + 20;
        var overlapY = itemRect.bottom > basketRect.top + 10 && itemRect.top < basketRect.top + 55;
        if(overlapX && overlapY){
          item.caught = true;
          score++;
          scoreEl.textContent = score;
          catchPop(itemRect.left - fieldRect.left, itemRect.top - fieldRect.top);
          if(item.el.parentNode) item.el.remove();
          fallingItems.splice(i,1);
          if(score >= targetScore){
            finishGame();
          }
        }
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  var continueBtn1 = $('#continue-1');
  function finishGame(){
    if(!gameActive) return;
    gameActive = false;
    clearInterval(spawnTimer);
    continueBtn1.classList.add('show');
  }
  // fallback: reveal continue after 22s regardless of score
  setTimeout(function(){
    if(gameActive){ continueBtn1.classList.add('show'); }
  }, 22000);

  continueBtn1.addEventListener('click', function(){
    goToSection('mixtape');
  });

  /* ---------------- SECTION 2: mixtape ---------------- */
  var activeAudio = null;

  $all('.song-row').forEach(function(row){
    var btn = row.querySelector('.play-btn');
    var audio = row.querySelector('.site-audio');
    var reels = $('#reels');
    if(!btn || !audio) return;

    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();

      // Stop the other track.
      $all('.site-audio').forEach(function(other){
        if(other !== audio){
          other.pause();
          other.currentTime = 0;
          var otherBtn = other.closest('.song-row').querySelector('.play-btn');
          otherBtn.textContent = '▶';
        }
      });

      if(audio.paused){
        // The MP3 is loaded from the repository root.
        audio.play().then(function(){
          activeAudio = audio;
          btn.textContent = '❚❚';
          reels.classList.remove('paused');
        }).catch(function(){
          // Do NOT open a file picker. If GitHub cannot find the MP3, show a small hint.
          btn.textContent = '⚠';
          setTimeout(function(){ btn.textContent = '▶'; }, 1800);
        });
      }else{
        audio.pause();
        btn.textContent = '▶';
        reels.classList.add('paused');
        if(activeAudio === audio) activeAudio = null;
      }
    });

    audio.addEventListener('play', function(){
      btn.textContent = '❚❚';
      reels.classList.remove('paused');
    });
    audio.addEventListener('pause', function(){
      btn.textContent = '▶';
    });
    audio.addEventListener('ended', function(){
      btn.textContent = '▶';
      reels.classList.add('paused');
      if(activeAudio === audio) activeAudio = null;
    });
    audio.addEventListener('error', function(){
      console.error('Не удалось загрузить трек:', audio.src);
    });
  });

  $('#continue-2').addEventListener('click', function(){
    goToSection('scrapbook');
  });

  /* simple flower SVG for mixtape corners */
  function buildBloom(id){
    var g = document.getElementById(id);
    if(!g) return;
    var petals = '';
    var colors = ['#d97a6c','#e8a2a0','#f0c14b','#c98fb0'];
    for(var i=0;i<5;i++){
      var angle = (360/5)*i;
      petals += '<ellipse cx="100" cy="70" rx="22" ry="34" fill="'+colors[i%colors.length]+'" opacity="0.85" transform="rotate('+angle+' 100 100)"/>';
    }
    petals += '<circle cx="100" cy="100" r="14" fill="#f6dfa9"/>';
    g.innerHTML = petals;
  }
  ['bloomTL','bloomTR','bloomBL','bloomBR'].forEach(buildBloom);

  /* ---------------- SECTION 3: scrapbook photos ---------------- */
  var STORAGE_KEY_PREFIX = 'fml_photo_';

  function loadPublishedPhoto(image, index){
    var frame = image.closest('.frame');
    var candidates = [
      './photo-' + index + '.jpg',
      './photo-' + index + '.jpeg',
      './photo-' + index + '.png',
      './photo-' + index + '.webp',
      './images/photo-' + index + '.jpg',
      './images/photo-' + index + '.jpeg',
      './images/photo-' + index + '.png',
      './images/photo-' + index + '.webp'
    ];
    var pos = 0;

    function tryNext(){
      if(pos >= candidates.length){
        image.style.display = 'none';
        frame.classList.add('photo-missing');
        frame.dataset.photoIndex = index;
        return;
      }
      var src = candidates[pos++];
      image.onerror = tryNext;
      image.onload = function(){
        image.style.display = 'block';
        frame.classList.remove('photo-missing');
      };
      image.src = src;
    }
    tryNext();
  }

  function wirePolaroid(label, index){
    var input = label.querySelector('.photo-input');
    var image = label.querySelector('.site-photo');
    if(!image) return;

    input.addEventListener('change', function(){
      var file = input.files && input.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(e){
        image.src = e.target.result;
        image.style.display = 'block';
        var frame = image.closest('.frame');
        frame.classList.remove('photo-missing');
        try{ localStorage.setItem(STORAGE_KEY_PREFIX + index, e.target.result); }catch(err){}
      };
      reader.readAsDataURL(file);
    });

    try{
      var saved = localStorage.getItem(STORAGE_KEY_PREFIX + index);
      if(saved){
        image.src = saved;
        image.style.display = 'block';
      } else {
        loadPublishedPhoto(image, index);
      }
    }catch(err){
      loadPublishedPhoto(image, index);
    }
  }

  $all('.polaroid').forEach(function(label, index){
    wirePolaroid(label, index + 1);
  });

  $('#continue-3').addEventListener('click', function(){
    goToSection('favorite');
  });

  /* ---------------- SECTION 4: video ---------------- */
  var videoFrame = $('#videoFrame');
  var videoInput = $('#videoInput');
  var videoEl = $('#loveVideo');
  var videoPlaceholder = $('#videoPlaceholder');

  // GitHub Pages: love-video.mp4 is next to index.html.
  var videoCandidates = [
    './love-video.mp4',
    'love-video.mp4',
    './video/love-video.mp4',
    'video/love-video.mp4'
  ];

  function showVideo(){
    videoPlaceholder.style.display = 'none';
    videoEl.style.display = 'block';
  }

  function showVideoPlaceholder(){
    videoEl.style.display = 'none';
    videoPlaceholder.style.display = 'flex';
  }

  function tryPublishedVideo(index){
    if(index >= videoCandidates.length){
      showVideoPlaceholder();
      return;
    }
    videoEl.src = videoCandidates[index];
    videoEl.load();
  }

  videoEl.addEventListener('loadedmetadata', function(){
    showVideo();
  });

  videoEl.addEventListener('canplay', function(){
    showVideo();
  });

  videoEl.addEventListener('error', function(){
    var current = videoEl.getAttribute('data-video-attempt') || '0';
    var next = parseInt(current, 10) + 1;
    videoEl.setAttribute('data-video-attempt', String(next));
    tryPublishedVideo(next);
  });

  videoInput.addEventListener('change', function(){
    var file = videoInput.files && videoInput.files[0];
    if(!file) return;

    if(videoEl._objectUrl){
      URL.revokeObjectURL(videoEl._objectUrl);
    }

    videoEl._objectUrl = URL.createObjectURL(file);
    videoEl.src = videoEl._objectUrl;
    videoEl.load();
    showVideo();
  });

  videoPlaceholder.addEventListener('click', function(){
    videoInput.click();
  });

  videoEl.style.display = 'none';
  videoEl.setAttribute('data-video-attempt', '0');
  tryPublishedVideo(0);

  $('#restartBtn').addEventListener('click', function(){
    goToSection('game');
  });

})();
</script>

<script>
/* GITHUB_AUDIO_PLAYER_START */
(function () {
  function setupPlayers() {
    var rows = document.querySelectorAll('.song-row');
    var players = document.querySelectorAll('.site-audio');

    rows.forEach(function (row, i) {
      var btn = row.querySelector('.play-btn');
      var audio = row.querySelector('.site-audio');
      if (!btn || !audio) return;

      // If markup did not contain an audio element, pair by row index.
      if (!audio && players[i]) audio = players[i];

      btn.addEventListener('click', function () {
        // Stop every other track.
        document.querySelectorAll('.site-audio').forEach(function (other) {
          if (other !== audio) {
            other.pause();
            other.currentTime = 0;
            var otherRow = other.closest('.song-row');
            if (otherRow) {
              var otherBtn = otherRow.querySelector('.play-btn');
              if (otherBtn) otherBtn.textContent = '▶';
            }
          }
        });

        if (audio.paused) {
          var promise = audio.play();
          if (promise && typeof promise.catch === 'function') {
            promise.catch(function () {
              btn.textContent = '⚠';
              btn.title = 'Не удалось загрузить MP3 из корня сайта';
            });
          }
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', function () {
        btn.textContent = '❚❚';
      });
      audio.addEventListener('pause', function () {
        btn.textContent = '▶';
      });
      audio.addEventListener('ended', function () {
        btn.textContent = '▶';
      });
      audio.addEventListener('error', function () {
        // Do not open a local file picker. Show the error only if the
        // published GitHub Pages file really cannot be loaded.
        btn.textContent = '⚠';
        btn.title = 'MP3 не загрузился. Проверь имя файла в репозитории.';
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupPlayers);
  } else {
    setupPlayers();
  }
})();
/* GITHUB_AUDIO_PLAYER_END */
</script>

</body>
